<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Subscription</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <h1>Subscription Tracker</h1>

        <nav>
            <a href="index.html" class="btn btn-primary">
                Add Subscription
            </a>

            <a href="subscriptions.html" class="btn btn-primary">
                View Subscriptions
            </a>
        </nav>
    </header>

    <main class="container">

        <section id="form-section" class="card">

            <h2 class="section-title">Add Subscription</h2>

            <form id="subscription-form" class="form-grid">

                <label for="service">Service</label>
                <input type="text" id="service" class="input" required>

                <label for="provider">Provider</label>
                <input type="text" id="provider" class="input" required>

                <label for="subscriber">Subscriber</label>
                <input type="text" id="subscriber" class="input" required>

                <label for="renewal-date">Renewal Date</label>
                <input type="date" id="renewal-date" class="input" required>

                <label for="category">Category</label>

                <select id="category" class="input" required>
                    <option value="">Select Category</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Education">Education</option>
                    <option value="Software">Software</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit" class="btn btn-primary">
                    Add Subscription
                </button>

            </form>

        </section>

    </main>

    <script src="subscription-library.js"></script>
    <script src="app.js"></script>

</body>
</html>
