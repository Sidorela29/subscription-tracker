<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <h1>Subscription Tracker</h1>
    </header>

    <main class="container">

        <!-- Section 1: Form -->
        <section id="form-section" class="card">

            <h2 class="section-title">Add Subscription</h2>

            <form id="subscription-form" class="form-grid">

                <label for="service">Service</label>
                <input type="text" id="service" class="input" required>

                <label for="provider">Provider</label>
                <input type="text" id="provider" class="input" required>

                <label for="subscriber">Subscriber</label>
                <input type="text" id="subscriber" class="input" required>

                <label for="renewal-date">Renewal Date</label>
                <input type="date" id="renewal-date" class="input" required>

                <label for="category">Category</label>
                <select id="category" class="input" required>
                    <option value="">Select Category</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Education">Education</option>
                    <option value="Software">Software</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit" class="btn btn-primary">
                    Add Subscription
                </button>

            </form>

        </section>

        <!-- Section 2: Table -->
        <section id="table-section" class="card">

            <h2 class="section-title">Subscriptions</h2>

            <div class="table-responsive">

                <table class="table">
                    <thead>
                        <tr>
                            <th>Service</th>
                            <th>Provider</th>
                            <th>Subscriber</th>
                            <th>Renewal Date</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="subscription-list">
                    </tbody>

                </table>

            </div>

        </section>

        <!-- Section 3: Summary -->
        <section id="summary-section" class="card">

            <h2 class="section-title">Summary</h2>

            <div class="summary">

                <div class="summary-item">
                    <p>Total Subscriptions</p>
                    <h3 id="total-subscriptions">0</h3>
                </div>

                <div class="summary-item">
                    <p>Expired Subscriptions</p>
                    <h3 id="expired-subscriptions">0</h3>
                </div>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
